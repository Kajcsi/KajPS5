name: Runtime defect
description: Report a repeatable KajPS5 defect.
title: "[Defect]: "
labels:
  - defect
body:
  - type: markdown
    attributes:
      value: Do not upload games, firmware, keys, or proprietary system files.
  - type: input
    id: commit
    attributes:
      label: KajPS5 commit
      description: Enter the full commit ID.
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Give the shortest repeatable steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
