name: Runtime defect
description: Report a repeatable KajPS5 defect.
title: "[Defect]: "
labels:
  - defect
body:
  - type: markdown
    attributes:
      value: Do not upload games, firmware, keys, or proprietary system files.
  - type: input
    id: commit
    attributes:
      label: KajPS5 commit
      description: Enter the full commit ID.
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add any public logs or details that may help.
    validations:
      required: false
