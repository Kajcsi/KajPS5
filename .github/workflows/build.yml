name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B _Build -A x64
      - name: Build
        run: cmake --build _Build --config Release --parallel
      - name: Test
        run: ctest --test-dir _Build -C Release --output-on-failure

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SPIRV-Tools
        run: sudo apt-get update && sudo apt-get install -y spirv-tools
      - name: Configure
        run: cmake -S . -B _Build -DCMAKE_BUILD_TYPE=Release -DKAJPS5_REQUIRE_SPIRV_VAL=ON
      - name: Build
        run: cmake --build _Build --parallel
      - name: Test
        run: ctest --test-dir _Build --output-on-failure
